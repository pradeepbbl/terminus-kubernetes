name: Release

on:
  push:
    tags: ["v*"]

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, e2e]
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Helm Setup
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Verify Tag Matches Chart Version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CHART_VERSION="$(helm show chart charts/terminus | sed -n 's/^version: //p')"
          if [ "${VERSION}" != "${CHART_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Chart.yaml version ${CHART_VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Registry Login
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package Chart
        run: helm package charts/terminus

      - name: Push Chart
        run: |
          helm push "terminus-${{ steps.version.outputs.version }}.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "terminus-${{ steps.version.outputs.version }}.tgz" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
